name: CrisisGrid CI Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite & Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite & Hypothesis Invariants
        run: |
          export PYTHONPATH=backend
          python -m pytest backend/tests -v

  frontend-build:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Check & Next.js Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000/ws

  integration-smoke-test:
    name: End-to-End Integration Smoke Test
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start Background FastAPI Gateway
        run: |
          export PYTHONPATH=backend
          python run_backend.py &
          sleep 3

      - name: Run Automated Smoke Test
        run: |
          python scripts/smoke_test.py
        env:
          SMOKE_BACKEND_URL: http://127.0.0.1:8000
          X_API_KEY: crisis-allocation-demo-secret-key-2026
